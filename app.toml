# BatchLens's manifest: the single source of its metadata (the suite's app standard, section 4).
# The launcher card, the Apps page, the package manifest, the image labels and /api/meta read it.

[app]
id = "batchlens"
name = "BatchLensCraft"
version = "0.2.0"
category = "Example"
summary = "Batch analytics for mAb manufacturing on synthetic data: from cell density to drug substance."
description = """\
BatchLens follows simulated antibody batches from production culture through purification to \
drug substance: integral of viable cell density, specific productivity, product mass at harvest, \
each step's yield and what is left of the harvest, each with its status, reasons and inputs. \
Synthetic data only: not for process control, release or batch disposition."""
# "Dev Publisher" matches PlantCraft's development key (`make dev-package`); a real release names
# the company whose key the stack trusts (the template's packaging guide).
publisher = "Dev Publisher"
license = "Apache-2.0"
homepage = ""
mark = "batchlens"

[runtime]
# An app outside the suite table takes a prefix, port and container user that no suite app
# uses (docs/app-standard.md, section 7, of PlantCraft): a port from 9000 and a user from 20000.
prefix = "/batchlens/"
port = 9100
uid = 20100
health = "/healthz"
image = "batchlens"

[requires]
processcraft_api = ">=1.0"
sdk = "0.104.0"
asset_types = []
roles = {}

[permissions]
read = ["assets", "signals", "series"]
write = ["audit", "events"]
plant_write = false
outbound = []

[publishes]
results = []

[consumes]
results = []

# The one event BatchLens writes (src/batchlens/suite/events.py): a phase execution under way on
# its asset. PlantCraft stamps an event when it arrives, so its time is when BatchLens reported
# it; the phase's own times are in the payload.
[[publishes.events]]
name = "phase.running"
title = "Batch phase running"
description = "A phase execution of a batch is under way on the asset (start) or is over (end). Key: the phase execution's id."
severity = "info"
category = "process"
phase = "interval"
payload = { batch = "Batch id", phase = "Phase execution id", kind = "Phase kind", start = "When the phase began (UTC)", end = "When it ended (UTC); none while it runs" }

# Two read-only tools for PlantCraft's assistant, called as the person who asks and served at
# <prefix>api/assistant/tools/<id> (src/batchlens/api/routers/tools.py).
[[contributes.assistant.tools]]
id = "list_batches"
title = "List the BatchLens batches"
description = """\
The synthetic antibody batches BatchLens follows: id, product, start and end, bioreactor, and \
which one is the reference. Use it to find a batch's id before asking about that batch."""
reads = "The batches in the app's own database."

[[contributes.assistant.tools]]
id = "batch_findings"
title = "Read a batch's metrics and findings"
description = """\
For one synthetic batch: each calculated metric (cell growth, productivity, product mass, yield, \
recovery) with its status and reasons, the findings against the reference batch, and the yield \
of each purification step. Use it for questions about a batch's yield, productivity or recovery. \
It reports observations and calculations, never a cause."""
reads = "The batch's records in the app, and the bioreactor's volume signal in PlantCraft, as the person."
[[contributes.assistant.tools.args]]
key = "batch"
title = "Batch id"
required = true

[backup]                            # its data folder in the suite's backup (PlantCraft docs/operations.md)
sqlite = ["batchlens.sqlite3"]
skip = ["logs/"]

[suggests]
asset_types = []

# Coming in the PlantCraft release after 0.6.0 (the app package format, PlantCraft PR #179): uncomment
# when the SDK in vendor/ knows these keys; docs/packaging.md says what each one means.
#
# [app]  (these two go under [app] above)
# source = "open"                   # "closed": compiled image and a licence
# languages = ["en", "pt-BR"]       # each language other than "en" needs its locales/<lang>.json
#
# [requires]  (this one goes under [requires] above)
# platform = ">=0.7,<0.9"           # PlantCraft versions the app installs on
#
# [license]                         # closed apps only: a signed .pclicense per installation
# required = true
# grace_days = 14
